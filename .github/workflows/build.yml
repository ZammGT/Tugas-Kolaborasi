
name: Build C++ Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2

      - name: Compile C++
        run: g++ main.cpp -o triox2.exe -static -O2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: colab-Windows
          path: triox2.exe
